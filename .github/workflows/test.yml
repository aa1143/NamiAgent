name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install openai pytest
      - name: 语法检查（全部 11 课）
        run: python -m compileall -q lessons
      - name: 测试（第 3 课起，用假模型，不需要 API Key）
        run: |
          for d in lessons/lesson-*; do
            if [ -d "$d/tests" ]; then
              echo "::group::$d"
              (cd "$d" && python -m pytest -q) || exit 1
              echo "::endgroup::"
            fi
          done
